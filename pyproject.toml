[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-telemetry-lab"
version = "0.1.0"
description = "Reliable, dependency-free edge telemetry pipeline challenge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adrian Monge Mairena" }]

[project.scripts]
edge-telemetry = "edge_telemetry.cli:main"

[tool.setuptools.packages.find]
include = ["edge_telemetry*"]

